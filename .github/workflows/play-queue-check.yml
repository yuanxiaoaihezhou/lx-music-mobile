name: Check play queue

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint
      - run: node tests/play-queue.test.cjs
      - run: node tests/play-queue-player.test.cjs
      - run: npm run build-test
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build bundled test APK
        working-directory: android
        env:
          DISABLE_SVG: 1
        run: >-
          ./gradlew assembleRelease
          -PMYAPP_UPLOAD_STORE_FILE=debug.keystore
          -PMYAPP_UPLOAD_KEY_ALIAS=androiddebugkey
          -PMYAPP_UPLOAD_STORE_PASSWORD=android
          -PMYAPP_UPLOAD_KEY_PASSWORD=android
      - uses: actions/upload-artifact@v4
        with:
          name: play-queue-test-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
